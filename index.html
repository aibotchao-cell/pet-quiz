<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>PET 練習站</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:#11131a;color:#e8eaf0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
    min-height:100vh;
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;
    overscroll-behavior:none;
  }
  h1{font-size:19px;margin:0 0 2px;letter-spacing:.5px}
  .sub{font-size:12px;color:#7d8496;margin-bottom:14px}
  .bar{height:6px;background:#1e222d;border-radius:99px;overflow:hidden;margin:10px 0 4px}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4d8cff,#7b5cff);transition:width .25s}
  .meta{display:flex;justify-content:space-between;font-size:12px;color:#8a92a6;font-variant-numeric:tabular-nums}
  .card{background:#171a23;border:1px solid #232838;border-radius:16px;padding:16px;margin-top:14px}
  .part{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;background:#22283a;color:#93a4c6;margin-bottom:10px}
  .passage{background:#121620;border:1px solid #202636;border-radius:12px;padding:13px 14px;margin-bottom:14px;font-size:14.5px;line-height:1.75;color:#cbd4e6}
  .passage p{margin:0 0 9px}
  .passage p:last-child{margin-bottom:0}
  .passage.notice{font-family:Georgia,serif;text-align:center;font-weight:600;letter-spacing:.3px;color:#e2e8f5}
  .passage.title{font-weight:700;color:#e8eaf0}
  .q{font-size:20px;line-height:1.5;margin:2px 0 14px;font-weight:600}
  .q.en{font-family:Georgia,"Times New Roman",serif;font-style:italic}
  .q.small{font-size:16.5px;font-weight:500;color:#dfe5f2}
  .opt{
    display:flex;align-items:center;gap:10px;width:100%;
    background:#1b2030;border:1.5px solid #2a3145;color:#e8eaf0;
    border-radius:12px;padding:13px 14px;margin-bottom:9px;
    font-size:16px;text-align:left;cursor:pointer;
    transition:background .15s,border-color .15s,transform .08s;
  }
  .opt:active{transform:scale(.985)}
  .opt .k{flex:0 0 24px;height:24px;line-height:24px;text-align:center;background:#2a3145;color:#9fb0d0;border-radius:7px;font-size:12px;font-weight:700}
  .opt.correct{background:#12351f;border-color:#2f9e5f}
  .opt.correct .k{background:#2f9e5f;color:#04120a}
  .opt.wrong{background:#3a1620;border-color:#c3425c}
  .opt.wrong .k{background:#c3425c;color:#1a050a}
  .opt.dim{opacity:.45}
  .opt:disabled{cursor:default}
  .fb{margin-top:12px;font-size:14px;line-height:1.65;display:none}
  .fb.show{display:block}
  .fb .verdict{font-weight:700;margin-bottom:4px}
  .fb .tip{color:#a9b4cc}
  .fb .tr{color:#7d8496;font-size:12.5px;margin-top:8px;line-height:1.6;border-top:1px dashed #2a3145;padding-top:8px}
  .btn{display:block;width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#4d8cff,#7b5cff);color:#fff;font-size:16px;font-weight:700;margin-top:14px;cursor:pointer}
  .btn.ghost{background:#1b2030;border:1.5px solid #2a3145;color:#c3cde3}
  .btn:active{transform:scale(.99)}
  .btn:disabled{opacity:.5}
  .menu{display:block;width:100%;text-align:left;background:#171a23;border:1px solid #232838;border-radius:16px;padding:16px;margin-top:12px;color:#e8eaf0;cursor:pointer}
  .menu:active{border-color:#4d8cff}
  .menu .t{font-size:17px;font-weight:700;margin-bottom:3px}
  .menu .d{font-size:12.5px;color:#7d8496;line-height:1.5}
  .menu .best{font-size:12px;color:#5ee08a;margin-top:6px}
  .score{font-size:52px;font-weight:800;text-align:center;margin:6px 0 0;font-variant-numeric:tabular-nums}
  .score small{font-size:18px;color:#7d8496;font-weight:600}
  .verdict2{text-align:center;color:#a9b4cc;font-size:14px;line-height:1.6;margin:8px 0 4px}
  .wlist{margin:6px 0 0;padding:0;list-style:none}
  .wlist li{border-top:1px solid #232838;padding:11px 0;font-size:14px;line-height:1.55}
  .wlist li:first-child{border-top:none}
  .wlist .h{font-weight:700;color:#e8eaf0}
  .wlist .r{color:#8a92a6;font-size:13px}
  .wlist .r b{color:#5ee08a;font-weight:700}
  .wlist .r s{color:#e07186}
  .center{text-align:center}
  .hint{font-size:12px;color:#6b7385;text-align:center;margin-top:16px;line-height:1.6}
  label.tog{display:flex;align-items:center;gap:9px;font-size:14px;color:#a9b4cc;margin-top:14px;cursor:pointer}
  input[type=checkbox]{width:18px;height:18px;accent-color:#4d8cff}
  .typed{display:flex;gap:8px;margin-top:6px}
  .typed input{flex:1;background:#1b2030;border:1.5px solid #2a3145;color:#e8eaf0;border-radius:12px;padding:13px 14px;font-size:17px;outline:none;font-family:Georgia,serif}
  .typed input:focus{border-color:#4d8cff}
  .typed button{flex:0 0 84px;margin:0;padding:13px;font-size:15px}
  .mrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .mrow .nm{flex:1;font-size:14px;line-height:1.5}
  .mrow .nm b{display:block;font-size:14.5px;color:#e8eaf0}
  .mrow .nm span{color:#8a92a6;font-size:12.5px}
  .mrow select{flex:0 0 92px;background:#1b2030;border:1.5px solid #2a3145;color:#e8eaf0;border-radius:10px;padding:10px;font-size:15px}
  .mrow.ok select{border-color:#2f9e5f;background:#12351f}
  .mrow.no select{border-color:#c3425c;background:#3a1620}
  .opts8{margin:4px 0 14px;padding:0;list-style:none;font-size:13.5px;line-height:1.6;color:#a9b4cc}
  .opts8 li{margin-bottom:6px}
  .opts8 li b{color:#93a4c6}
  .audio{display:flex;gap:8px;margin-bottom:14px}
  .audio button{flex:1;background:#1b2030;border:1.5px solid #2a3145;color:#dbe3f4;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer}
  .audio button.main{background:linear-gradient(135deg,#4d8cff,#7b5cff);border:none;color:#fff}
  .audio button:disabled{opacity:.45}
  .warn{font-size:11.5px;color:#7d8496;margin-top:-6px;margin-bottom:10px;line-height:1.5}
</style>
</head>

<script>
(function(){
  "use strict";

  /* ============ 單字 ============ */
  var VOCAB = [
    {q:"borrow", o:["借出","借入","買下","賣掉"], a:1, t:"borrow = 借入。lend = 借出。"},
    {q:"lend", o:["借入","借出","歸還","付款"], a:1, t:"lend = 借出；borrow = 借入。"},
    {q:"arrive", o:["出發","離開","抵達","停留"], a:2, t:"arrive at + 小地點；arrive in + 城市國家。"},
    {q:"describe", o:["描述","決定","討論","發現"], a:0, t:"describe = 描述，名詞 description。"},

    {q:"dangerous", o:["吵鬧的","陌生的","危險的","困難的"], a:2, t:"dangerous = 危險的，名詞 danger。"},
    {q:"explain", o:["解釋","抱怨","邀請","承諾"], a:0, t:"explain sth to sb，不能說 explain me。"},

    {q:"weather", o:["天氣","是否","水","更暖"], a:0, t:"weather 天氣 vs whether 是否。"},
    {q:"decide", o:["分開","描述","決定","討論"], a:2, t:"decide to do sth。"},
    {q:"cheap", o:["便宜的","貴的","刺激的","容易的"], a:0, t:"cheap 反義 expensive。"},
    {q:"suggest", o:["建議","支持","假設","使驚訝"], a:0, t:"suggest doing sth / suggest that + 原形。"},
    {q:"準時", o:["in time","on time","at time","by time"], a:1, t:"on time 準時；in time 趕上。"},
    {q:"Can I ______ your phone?", o:["lend","borrow","keep","return"], a:1, t:"借入 = borrow。"},
    {q:"She ______ me her bike yesterday.", o:["borrowed","lent","lend","borrowing"], a:1, t:"借出過去式 = lent。"},
    {q:"I'm looking ______ my glasses.", o:["after","for","at","up"], a:1, t:"look for = 尋找。"},
    {q:"We arrived ______ the airport at seven.", o:["to","in","at","on"], a:2, t:"arrive at + 具體地點。"},
    {q:"He's very good ______ maths.", o:["in","at","on","for"], a:1, t:"be good at。"},
    {q:"She has lived here ______ 2019.", o:["for","since","from","in"], a:1, t:"since + 起點；for + 一段時間。"},
    {q:"Would you like ______ come with us?", o:["come","coming","to come","came"], a:2, t:"would like to + 原形。"},
    {q:"My sister is afraid ______ dogs.", o:["of","from","with","about"], a:0, t:"be afraid of。"}
  ];

  /* ============ 閱讀 ============ */
  var READING = [
    { part:"Part 1", kind:"mc", items:[
      { passage:"SWIMMING POOL CLOSED\nMonday 3 – Wednesday 5 June\n\nMembers may use the pool at the Sports Centre free of charge during this period. Please show your card at reception.", notice:true,
        q:"What does the notice tell members to do?", o:["Pay at the Sports Centre","Show their card when they go to the Sports Centre","Wait until Thursday to swim"], a:1,
        t:"免費使用的條件是出示會員卡，不是付費。" },
      { passage:"Hi Sam — I'm at the cinema already. The film starts at 7.30, not 8.00 like we thought. I've got your ticket, so come straight to screen 4. Jess",
        q:"Why is Jess writing to Sam?", o:["To change the meeting place","To say the film starts earlier than expected","To ask Sam to buy a ticket"], a:1,
        t:"原本以為 8.00，實際 7.30 → 比預期早。" },
      { passage:"Dear students,\nPlease bring your projects to class on Friday. You do not need to print them — a USB stick is fine. The classroom will be open from 8.00 if you need more time.",
        q:"What are the students asked to do?", o:["Print their projects","Bring their projects in digital form","Arrive before 8.00"], a:1,
        t:"「不用印，USB 可以」＝數位檔即可。" },
      { passage:"SPECIAL OFFER\nBuy two T-shirts and get the third one HALF PRICE.\nOffer ends Sunday.", notice:true,
        q:"What does the sign say?", o:["All T-shirts are half price","The third T-shirt costs less than the others","The offer starts on Sunday"], a:1,
        t:"第三件半價，不是全部半價。" },
      { passage:"Tom — I'll be home late tonight. There's pasta in the fridge, heat it for five minutes. And don't forget the rubbish before 9. Mum",

        t:"加熱＋倒垃圾；pasta 已經煮好放在冰箱。" }
    ]},

    { part:"Part 2", kind:"match",
      lead:"下面五個人各自需要一個地方或活動。從 A–H 選出最適合的選項（每個選項只能用一次）。",
      people:[
        {name:"Maria", desc:"wants a cheap weekend activity for her children, aged 6 and 8"},

        {name:"Lucy", desc:"wants to meet other people who enjoy photography"}

      options:[

        {k:"E", txt:"Camera Club — meets every Wednesday. All levels welcome. Bring your own camera."},

        {k:"G", txt:"Community Garden — help grow vegetables. Families welcome on Sundays."},
        {k:"H", txt:"Language Café — practise English over coffee, Thursday evenings, free."}
      ],
      answer:[2,0,1,3,4]
    },

    { part:"Part 3", kind:"passage",
      passage:"##Ella's summer at sea\n\nLast July, Ella Mason, 14, joined a sailing course on a 90-year-old tall ship. She had never sailed before, and for the first two days she was seasick. \"I honestly wanted to go home,\" she says. \"Then on the third morning the sea was calm, and I finally started to enjoy it.\"\n\nThere were twenty young people on the ship, aged 13 to 17, and six adults. Everyone had a job: cooking, cleaning, and helping with the sails. Ella's favourite job was steering. \"You have to watch the wind and the water all the time. It sounds boring, but it isn't — the ship tells you what it needs.\"\n\nThe hardest part was the night watch. Each person spent two hours on deck in the dark while the others slept. \"The first time I was terrified,\" Ella admits. \"But by the end I loved it. You see the stars, and you hear nothing except the water.\"\n\nElla is now saving for a longer course next year. She also says the trip changed how she feels about school. \"I'm better at working in a team, and I'm not scared of trying new things now. Before, I never put my hand up in class.\"",
      items:[
        {q:"How did Ella feel during the first two days?", o:["Excited","Unwell","Bored"], a:1, t:"seasick = 暈船，身體不舒服。"},
        {q:"What does Ella say about steering?", o:["It is easier than it looks.","It is never boring.","It is only done at night."], a:1, t:"\"It sounds boring, but it isn't\" → 不無聊。"},
        {q:"What surprised Ella about the night watch?", o:["She enjoyed it in the end.","She could not sleep during the day.","The adults did it instead of the young people."], a:0, t:"\"by the end I loved it\"。"},
        {q:"What is Ella doing now?", o:["Working to pay for another course","Teaching other young people to sail","Planning a trip with her school"], a:0, t:"saving for = 存錢，所以是工作賺錢。"},
        {q:"What does Ella say about school?", o:["She has become more confident.","She wants to study sailing there.","Her marks have got worse."], a:0, t:"\"not scared of trying new things\" → 更有自信。"}
      ]},

    { part:"Part 4", kind:"gap",
      lead:"閱讀下面文章，選出最適合每個空格的字。",
      passage:"**The science of sleep**\nMost teenagers know that sleep is important, (1) ___ few of them get enough of it. Doctors say people between 13 and 18 need about nine hours a night, but research (2) ___ that many get only seven. One reason is that phones and tablets keep young people (3) ___ late. The light from a screen tells the brain that it is still daytime. Experts (4) ___ that teenagers should stop using screens an hour before bed. They also say that going to bed at the (5) ___ time every night is more useful than sleeping late at weekends. Students who follow this advice often find that they can concentrate (6) ___ in class.",
      items:[
        {q:"空格 (1)：Most teenagers know that sleep is important, ___ few of them get enough of it.", o:["and","but","so","because"], a:1, t:"前後是對比（知道重要 vs 睡不夠）→ but。"},
        {q:"空格 (2)：research ___ that many get only seven", o:["shows","tells","speaks","looks"], a:0, t:"research shows that 是固定搭配。"},
        {q:"空格 (3)：phones keep young people ___ late", o:["wake","awake","waking","woke"], a:1, t:"keep sb awake = 讓某人保持清醒。"},
        {q:"空格 (4)：Experts ___ that teenagers should stop using screens", o:["suggest","suggest to","advise to","recommend to"], a:0, t:"suggest that + 子句；advise sb to do。"},
        {q:"空格 (5)：going to bed at the ___ time every night", o:["same","similar","equal","alike"], a:0, t:"at the same time = 同一時間。"},
        {q:"空格 (6)：they can concentrate ___ in class", o:["good","better","best","well"], a:1, t:"和以前比較（沒有 the）→ 比較級 better。"}
      ]},

    { part:"Part 5", kind:"cloze",
      lead:"每格填入一個字（不需要選項）。大小寫不計。",
      passage:"Hi Ben,\nThanks (1) ___ your email. I'm sorry I didn't answer sooner — I've been really busy (2) ___ school. Guess what? I've decided to join the school swimming team. We practise three times (3) ___ week, which is a lot, but I really enjoy it. The coach says I'm getting better (4) ___ I was last year. The only problem is that practice starts (5) ___ seven in the morning, so I have to get up at six. I'm not sure I'll ever get used (6) ___ that!\nWrite back soon, Alex",
      items:[
        {q:"空格 (1)：Thanks ___ your email.", accept:["for"], t:"Thanks for sth = 為某事道謝。"},
        {q:"空格 (2)：I've been really busy ___ school.", accept:["with","at"], t:"busy with sth。"},
        {q:"空格 (3)：We practise three times ___ week.", accept:["a","per","every"], t:"three times a week = 每週三次。"},
        {q:"空格 (4)：I'm getting better ___ I was last year.", accept:["than"], t:"比較級 ＋ than。"},
        {q:"空格 (5)：practice starts ___ seven in the morning.", accept:["at"], t:"時間點用 at。"},
        {q:"空格 (6)：I'll never get used ___ that!", accept:["to"], t:"be/get used to + N/V-ing。"}
      ]}
  ];

  /* ============ 聽力 ============ */
  var LISTENING = [
    { part:"Part 1", kind:"listen", audio:"audio/l1.mp3", lead:"聽一段簡短對話，選出正確答案。可以重聽。",

        {q:"Which platform will the train leave from?", o:["2","6","8"], a:1, t:"instead of platform two → 改成 6 號月台。"},

  ];

  /* ============ 引擎 ============ */
  var KEY = "petquiz_v2";
  var S = { test:null, steps:[], pos:0, picks:{}, match:{}, done:false, shuffle:true };

  function $(s){ return document.querySelector(s); }
  function el(t, c, x){ var e=document.createElement(t); if(c)e.className=c; if(x!==undefined)e.textContent=x; return e; }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function store(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){} }
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ return {}; } }
  function shuffleArr(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

  function buildSteps(test){
    var steps = [];
    if (test === "vocab") {
      VOCAB.forEach(function(it, i){ steps.push({ kind:"mc", part:"單字", data:it, key:"v"+i }); });
    } else if (test === "reading") {
      READING.forEach(function(g, gi){
        if (g.kind === "match") {
          steps.push({ kind:"match", part:g.part, group:g, key:"rg"+gi });
        } else {
          g.items.forEach(function(it, i){
            steps.push({ kind: (g.kind === "cloze" ? "cloze" : "mc"), part:g.part, group:g, data:it, key:"r"+gi+"_"+i });
          });
        }
      });
    } else {
      LISTENING.forEach(function(g, gi){
        g.items.forEach(function(it, i){
          steps.push({ kind:"listen", part:g.part, group:g, data:it, key:"l"+gi+"_"+i, first:(i===0) });
        });
      });
    }
    return steps;
  }

  function totalPoints(test){
    if (test === "reading") return 27;
    if (test === "listening") return 9;
    return VOCAB.length;
  }

  function startTest(test){
    S.test = test; S.pos = 0; S.picks = {}; S.match = {}; S.done = false;
    S.steps = buildSteps(test);
    if (S.shuffle && test === "vocab") shuffleArr(S.steps);
    renderStep();
  }

  function renderStep(){
    var app = $("#app"); app.innerHTML = "";
    if (S.pos >= S.steps.length) { renderResult(); return; }
    var st = S.steps[S.pos];
    var total = S.steps.length;

    app.appendChild(el("h1", null, testName(S.test)));
    app.appendChild(el("div","sub", st.part + "　·　第 " + (pointsBefore(S.pos)+1) + " / " + totalPoints(S.test) + " 題"));

    var barWrap = el("div","bar"), fill = el("i");
    fill.style.width = (S.pos/total*100)+"%";
    barWrap.appendChild(fill); app.appendChild(barWrap);

    var meta = el("div","meta");
    var mD = el("span",null,"已答 "+answeredCount()); mD.id="mDone";
    var mR = el("span",null,"答對 "+correctCount()); mR.id="mRight";
    meta.appendChild(mD); meta.appendChild(mR); app.appendChild(meta);

    var card = el("div","card");
    card.appendChild(el("span","part", st.part + "　" + partLabel(st)));

    if (st.kind === "match") { renderMatch(card, st); app.appendChild(card); return; }

    var g = st.group;
    if (g && g.passage) card.appendChild(renderPassage(g.passage, g.notice));
    if (st.kind === "listen") card.appendChild(renderAudio(st, g));

    if (st.kind === "mc") {
      card.appendChild(el("div","q"+(S.test==="vocab"?" en":" small"), st.data.q));
      var optEls = [];
      st.data.o.forEach(function(txt,i){
        var b = el("button","opt");
        b.appendChild(el("span","k","ABCD".charAt(i)));
        b.appendChild(el("span",null,txt));
        b.addEventListener("click", function(){ pick(st, i, optEls, fb, next); });
        optEls.push(b); card.appendChild(b);
      });
    } else if (st.kind === "listen") {
      card.appendChild(el("div","q small", st.data.q));
      var optEls = [];
      st.data.o.forEach(function(txt,i){
        var b = el("button","opt");
        b.appendChild(el("span","k","ABC".charAt(i)));
        b.appendChild(el("span",null,txt));
        b.addEventListener("click", function(){ pick(st, i, optEls, fb, next); });
        optEls.push(b); card.appendChild(b);
      });
    } else if (st.kind === "cloze") {
      card.appendChild(el("div","q small", st.data.q));
      var wrap = el("div","typed");
      var inp = document.createElement("input");
      inp.type="text"; inp.autocapitalize="off"; inp.autocorrect="off"; inp.spellcheck=false; inp.placeholder="打一個字";
      var okb = el("button","btn","確認");
      wrap.appendChild(inp); wrap.appendChild(okb); card.appendChild(wrap);
      okb.addEventListener("click", function(){
        var v = inp.value.trim().toLowerCase();
        if (!v) return;
        pick(st, v, [], fb, next, inp);
      });
      inp.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); okb.click(); } });
    }

    var fb = el("div","fb"); card.appendChild(fb);
    var next = el("button","btn","下一題"); next.style.display="none";
    next.addEventListener("click", function(){
      stopSpeak();
      S.pos++; renderStep();
    });
    card.appendChild(next);
    app.appendChild(card);

    if (st.kind === "mc" || st.kind === "listen") {
      if (S.picks[st.key] !== undefined) paint(st, S.picks[st.key], card.querySelectorAll(".opt"), fb, next);
    } else if (st.kind === "cloze") {
      if (S.picks[st.key] !== undefined) {
        card.querySelector("input").value = S.picks[st.key];
        card.querySelector("input").disabled = true;
        card.querySelector(".typed .btn").disabled = true;
        paint(st, S.picks[st.key], [], fb, next);
      }
    }
  }

  function partLabel(st){
    if (st.kind === "listen") return "聽力";
    if (st.kind === "cloze") return "填空";
    if (st.kind === "match") return "配對";
    if (st.kind === "gap") return "選字填空";
    return S.test === "vocab" ? "單字" : "閱讀";
  }

  function renderPassage(txt, notice){
    var d = el("div","passage"+(notice?" notice":""));
    txt.split("\n\n").forEach(function(par){
      var p = el("p");
      var heading = par.match(/^\*\*(.+?)\*\*\n?([\s\S]*)$/);
      if (heading) { p.appendChild(el("span","title",heading[1])); p.appendChild(document.createElement("br")); p.appendChild(document.createTextNode(heading[2])); }
      else if (par.indexOf("##") === 0) { p = el("p","title", par.replace(/^##/,"")); }
      else p.textContent = par;
      d.appendChild(p);
    });
    return d;
  }

  function renderAudio(st, g){
    var holder = el("div");
    var a = document.createElement("audio");
    a.controls = true;
    a.preload = "metadata";
    a.src = g.audio;
    a.style.width = "100%";
    a.style.marginBottom = "8px";
    holder.appendChild(a);
    holder.appendChild(el("div","warn","英式發音，可重複播放。正式考試每段只播兩次。"));
    return holder;
  }

  var speaking = false;
  function stopSpeak(){ speaking = false; }

  function pick(st, val, optEls, fb, next, inp){
    if (S.picks[st.key] !== undefined) return;
    S.picks[st.key] = val;
    paint(st, val, optEls, fb, next, inp);
    updateMeta();
  }

  function paint(st, val, optEls, fb, next, inp){
    var d = st.data, ok;
    if (st.kind === "cloze") {
      ok = d.accept.map(function(x){ return x.toLowerCase(); }).indexOf(String(val).toLowerCase()) >= 0;
      if (inp) inp.disabled = true;
      var b = document.querySelector(".typed .btn"); if (b) b.disabled = true;
    } else {
      ok = val === d.a;
      optEls = optEls.length ? optEls : document.querySelectorAll(".opt");
      Array.prototype.forEach.call(optEls, function(b,i){
        b.disabled = true;
        if (i === d.a) b.classList.add("correct");
        else if (i === val) b.classList.add("wrong");
        else b.classList.add("dim");
      });
    }
    fb.className = "fb show"; fb.innerHTML = "";
    var v = el("div","verdict", ok ? "✅ 答對了" : (st.kind==="cloze" ? "❌ 答案是 " + d.accept[0] : "❌ 正確答案是 " + "ABCD".charAt(d.a) + "．" + d.o[d.a]));
    v.style.color = ok ? "#5ee08a" : "#e07186";
    fb.appendChild(v);
    if (d.t) fb.appendChild(el("div","tip", d.t));
    if (st.kind === "listen" && st.group.script) {
      var tr = el("div","tr");
      tr.appendChild(el("b",null,"逐字稿："));
      tr.appendChild(document.createElement("br"));
      st.group.script.forEach(function(l){
        tr.appendChild(document.createTextNode((l[0]==="M"?"Man: ":"Woman: ") + l[1]));
        tr.appendChild(document.createElement("br"));
      });
      fb.appendChild(tr);
    }
    next.style.display = "block";
    next.textContent = (S.pos + 1 >= S.steps.length) ? "看結果" : "下一題";
  }

  function renderMatch(card, st){
    var g = st.group;
    if (g.lead) card.appendChild(el("div","passage", g.lead));
    var ul = el("ul","opts8");
    g.options.forEach(function(o){
      var li = el("li");
      li.appendChild(el("b",null,o.k+"　"));
      li.appendChild(document.createTextNode(o.txt));
      ul.appendChild(li);
    });
    card.appendChild(ul);

    var rows = [];
    g.people.forEach(function(p, i){
      var row = el("div","mrow");
      var nm = el("div","nm");
      nm.appendChild(el("b",null,p.name));
      nm.appendChild(el("span",null,p.desc));
      var sel = document.createElement("select");
      sel.innerHTML = '<option value="-1">—</option>' + g.options.map(function(o,j){ return '<option value="'+j+'">'+o.k+'</option>'; }).join("");
      if (S.match[st.key + "_" + i] !== undefined) { sel.value = String(S.match[st.key + "_" + i]); sel.disabled = true; }
      row.appendChild(nm); row.appendChild(sel);
      rows.push({ row:row, sel:sel, i:i });
      card.appendChild(row);
    });

    var fb = el("div","fb"); card.appendChild(fb);
    var btn = el("button","btn","檢查答案"); card.appendChild(btn);
    var next = el("button","btn","下一題"); next.style.display="none";
    next.addEventListener("click", function(){ S.pos++; renderStep(); });
    card.appendChild(next);

    function grade(){
      var right = 0;
      rows.forEach(function(r){
        var val = parseInt(r.sel.value, 10);
        S.match[st.key + "_" + r.i] = val;
        r.sel.disabled = true;
        r.row.classList.remove("ok","no");
        if (val === g.answer[r.i]) { r.row.classList.add("ok"); right++; }
        else { r.row.classList.add("no"); }
      });
      S.picks[st.key] = right;
      fb.className = "fb show"; fb.innerHTML = "";
      var v = el("div","verdict","答對 " + right + " / " + g.people.length);
      v.style.color = right === g.people.length ? "#5ee08a" : "#e8b34b";
      fb.appendChild(v);
      var ans = g.people.map(function(p,i){ return p.name + " → " + g.options[g.answer[i]].k; }).join("　");
      fb.appendChild(el("div","tip","正解：" + ans));
      btn.style.display = "none";
      next.style.display = "block";
      next.textContent = (S.pos + 1 >= S.steps.length) ? "看結果" : "下一題";
      updateMeta();
    }
    btn.addEventListener("click", function(){
      var missing = rows.some(function(r){ return r.sel.value === "-1"; });
      if (missing) { btn.textContent = "還有人沒選（再按一次仍可送出）"; btn.dataset.warn = "1"; }
      grade();
    });
    if (S.picks[st.key] !== undefined) {
      rows.forEach(function(r){
        var val = S.match[st.key + "_" + r.i];
        r.sel.value = String(val);
        r.sel.disabled = true;
        r.row.classList.add(val === g.answer[r.i] ? "ok" : "no");
      });
      btn.style.display = "none";
      next.style.display = "block";
      next.textContent = (S.pos + 1 >= S.steps.length) ? "看結果" : "下一題";
    }
  }

  function answeredCount(){
    var n = 0;
    S.steps.slice(0, S.pos+1).forEach(function(st){
      if (S.picks[st.key] !== undefined) n += stepWeight(st);
    });
    return n;
  }
  function stepWeight(st){ return st.kind === "match" ? st.group.people.length : 1; }
  function pointsBefore(pos){
    var n = 0;
    for (var i = 0; i < pos && i < S.steps.length; i++) n += stepWeight(S.steps[i]);
    return n;
  }
  function correctCount(){
    var n = 0;
    S.steps.forEach(function(st){
      if (S.picks[st.key] === undefined) return;
      if (st.kind === "match") n += S.picks[st.key];
      else if (st.kind === "cloze") { if (st.data.accept.map(function(x){return x.toLowerCase();}).indexOf(String(S.picks[st.key]).toLowerCase())>=0) n++; }
      else if (S.picks[st.key] === st.data.a) n++;
    });
    return n;
  }
  function updateMeta(){
    var d = $("#mDone"), r = $("#mRight");
    if (d) d.textContent = "已答 " + answeredCount();
    if (r) r.textContent = "答對 " + correctCount();
  }

  function testName(t){ return t === "vocab" ? "PET 單字測驗" : t === "reading" ? "PET 閱讀測驗" : "PET 聽力測驗"; }

  function renderResult(){
    var app = $("#app"); app.innerHTML = "";
    stopSpeak();
    var total = totalPoints(S.test);
    var right = correctCount();
    var pct = Math.round(right / total * 100);

    var st = load();
    st[S.test] = st[S.test] || {};
    if (!st[S.test].best || right > st[S.test].best) st[S.test].best = right;
    st[S.test].last = right;
    st[S.test].when = new Date().toISOString().slice(0,10);
    store(st);

    app.appendChild(el("h1", null, testName(S.test)));
    app.appendChild(el("div","sub center","結果"));

    var card = el("div","card center");
    card.appendChild(el("div","score")).innerHTML = right + "<small> / " + total + "</small>";
    card.appendChild(el("div","verdict2", pct + " 分"));
    var msg;
    if (pct >= 85) msg = "這個分數在 PET 是安全區，正式考試可以放心。";
    else if (pct >= 70) msg = "大約 B1 邊緣。把錯的題型再練一輪，穩定度會差很多。";
    else if (pct >= 55) msg = "還在 A2 往 B1 的路上。先別衝速度，把每題錯的原因講一次給你聽。";
    else msg = "這一份偏難。建議先降回 A2 題目建立信心，再回來。";
    card.appendChild(el("div","verdict2", msg));
    if (st[S.test].best === right) card.appendChild(el("div","verdict2","🏆 目前最佳"));
    app.appendChild(card);

    var wrongs = [];
    S.steps.forEach(function(stp){
      if (S.picks[stp.key] === undefined) return;
      if (stp.kind === "match") {
        if (S.picks[stp.key] < stp.group.people.length) wrongs.push({ h: stp.part + "　配對題", r: "答對 " + S.picks[stp.key] + " / " + stp.group.people.length });
        return;
      }
      if (stp.kind === "cloze") {
        var okC = stp.data.accept.map(function(x){return x.toLowerCase();}).indexOf(String(S.picks[stp.key]).toLowerCase())>=0;
        if (!okC) wrongs.push({ h: stp.part + "　" + stp.data.q, r: "正解 " + stp.data.accept[0] + "　你的答案 " + S.picks[stp.key], t: stp.data.t });
      } else if (S.picks[stp.key] !== stp.data.a) {
        wrongs.push({ h: stp.part + "　" + stp.data.q, r: "正解 " + stp.data.o[stp.data.a] + "　你的答案 " + stp.data.o[S.picks[stp.key]], t: stp.data.t });
      }
    });

    if (wrongs.length) {
      var wc = el("div","card");
      wc.appendChild(el("span","part","錯題 " + wrongs.length + " 項"));
      var ul = el("ul","wlist");
      wrongs.forEach(function(w){
        var li = el("li");
        li.appendChild(el("div","h", w.h));
        li.appendChild(el("div","r", w.r));
        if (w.t) li.appendChild(el("div","r", w.t));
        ul.appendChild(li);
      });
      wc.appendChild(ul); app.appendChild(wc);
    }

    var b1 = el("button","btn","再測一次");
    b1.addEventListener("click", function(){ startTest(S.test); });
    app.appendChild(b1);
    var b2 = el("button","btn ghost","回主選單");
    b2.addEventListener("click", function(){ renderHome(); });
    app.appendChild(b2);
  }

  /* ============ 首頁 ============ */
  function renderHome(){
    stopSpeak();
    var app = $("#app"); app.innerHTML = "";
    var st = load();

    app.appendChild(el("h1",null,"PET 練習站"));
    app.appendChild(el("div","sub","B1 程度　·　哥哥考試前練這個"));

    [["vocab","單字","26 題　·　高頻字 ＋ 易錯搭配"],
     ["reading","閱讀","27 題　·　PET Part 1–5 題型"],
     ["listening","聽力","9 題　·　Part 1–3，英式發音可重播"]].forEach(function(row){
      var b = el("button","menu");
      b.appendChild(el("div","t", row[1]));
      b.appendChild(el("div","d", row[2]));
      if (st[row[0]] && st[row[0]].best !== undefined) {
        b.appendChild(el("div","best","最佳 " + st[row[0]].best + " 分" + (st[row[0]].when ? "（" + st[row[0]].when + "）" : "")));
      }
      b.addEventListener("click", function(){ startTest(row[0]); });
      app.appendChild(b);
    });

    var lab = el("label","tog");
    var cb = document.createElement("input");
    cb.type="checkbox"; cb.checked = S.shuffle;
    cb.addEventListener("change", function(){ S.shuffle = cb.checked; });
    lab.appendChild(cb); lab.appendChild(el("span",null,"單字題打亂順序"));
    app.appendChild(lab);

    app.appendChild(el("div","hint","閱讀題目是照 PET 真實題型重寫的練習，不是真題。成績存在這台裝置。"));
  }

  window.__petquiz = { S:S, startTest:startTest, VOCAB:VOCAB, READING:READING, LISTENING:LISTENING, correctCount:correctCount, totalPoints:totalPoints };
  renderHome();
})();
</script>
</body>
</html>
